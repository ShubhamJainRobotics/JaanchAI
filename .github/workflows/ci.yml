name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      SUPABASE_URL: https://dummy-project.supabase.co
      SUPABASE_ANON_KEY: dummy-anon-key-placeholder-for-dev
      REPORT_HASH_PEPPER: dummy-test-report-hash-pepper-must-be-24-chars

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Security Check - No Secrets in Client
      run: npm run check:no-secrets

    - name: Security Check - No Banned Verdict Copy
      run: npm run check:banned-phrases

    - name: Typecheck
      run: npm run typecheck

    - name: Run Regression Corpus Evaluation
      run: npm run eval

    - name: Run Tests
      run: npm run test
